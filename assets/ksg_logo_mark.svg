<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" fill="#0A0A0A"/>
  
  <!-- Outer hexagon -->
  <polygon points="50,8 78,8 92,32 78,56 50,56 36,32" fill="none" stroke="#C9974A" stroke-width="2"/>
  <!-- Inner hexagon subtle -->
  <polygon points="50,18 68,18 77,32 68,46 50,46 41,32" fill="none" stroke="rgba(201,151,74,0.2)" stroke-width="1"/>
  
  <!-- K vertical spine -->
  <rect x="45" y="20" width="5" height="24" fill="#C9974A"/>
  <!-- K upper arm -->
  <polygon points="50,20 70,20 60,32 50,32" fill="#C9974A"/>
  <!-- K lower arm -->
  <polygon points="50,32 60,32 71,44 71,48 64,48 50,40" fill="#C9974A"/>
  
  <!-- Water ripple lines -->
  <line x1="30" y1="64" x2="70" y2="64" stroke="#C9974A" stroke-width="1.5" stroke-opacity="0.65"/>
  <line x1="34" y1="70" x2="66" y2="70" stroke="#C9974A" stroke-width="1" stroke-opacity="0.38"/>
  <line x1="38" y1="76" x2="62" y2="76" stroke="#C9974A" stroke-width="0.7" stroke-opacity="0.2"/>
</svg>
