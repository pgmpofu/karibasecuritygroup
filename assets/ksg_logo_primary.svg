<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="120" fill="#0A0A0A"/>
  
  <!-- Hexagon frame -->
  <polygon points="50,8 82,8 98,36 82,64 50,64 34,36" fill="none" stroke="#C9974A" stroke-width="1.8"/>
  <!-- Inner hexagon subtle -->
  <polygon points="50,18 72,18 83,36 72,54 50,54 39,36" fill="none" stroke="rgba(201,151,74,0.2)" stroke-width="1"/>
  
  <!-- K vertical spine -->
  <rect x="46" y="24" width="4" height="24" fill="#C9974A"/>
  <!-- K upper arm -->
  <polygon points="50,24 68,24 59,36 50,36" fill="#C9974A"/>
  <!-- K lower arm -->
  <polygon points="50,36 59,36 69,48 69,52 62,52 50,44" fill="#C9974A"/>
  
  <!-- Water ripple lines -->
  <line x1="28" y1="72" x2="104" y2="72" stroke="#C9974A" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="32" y1="78" x2="100" y2="78" stroke="#C9974A" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="36" y1="84" x2="96" y2="84" stroke="#C9974A" stroke-width="0.5" stroke-opacity="0.18"/>

  <!-- KARIBA wordmark -->
  <text x="118" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#F5F2ED" letter-spacing="-0.5">KARIBA</text>
  
  <!-- SECURITY GROUP -->
  <text x="120" y="64" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="400" fill="#C9974A" letter-spacing="5">SECURITY GROUP</text>
  
  <!-- Divider line -->
  <line x1="118" y1="72" x2="388" y2="72" stroke="rgba(201,151,74,0.3)" stroke-width="0.75"/>
  
  <!-- Tagline -->
  <text x="120" y="86" font-family="'Courier New', Courier, monospace" font-size="8.5" fill="rgba(245,242,237,0.4)" letter-spacing="2.5">APPLICATION SECURITY</text>
</svg>
